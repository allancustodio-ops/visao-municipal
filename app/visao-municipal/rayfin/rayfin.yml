id: visao-municipal
name: visao-municipal
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://fit-flame-ef120c4f60-southcentralus.webapp.fabricapps.net
